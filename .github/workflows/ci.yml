name: CI
on:
  push:
    branches:
      - main
      - develop
      - audit
  pull_request:
    branches:
      - "**"

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Submodules
        run: git submodule update --init --recursive
  
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Check format
        run: forge fmt --check

      - name: Build
        run: forge build
      
      - name: Run tests
        run: forge test -vvv

      - name: Run Coverage
        run: forge coverage --report lcov